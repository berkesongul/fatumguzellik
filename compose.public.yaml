services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      site:
        condition: service_healthy
    environment:
      SITE_DOMAIN: "${SITE_DOMAIN:?Set SITE_DOMAIN in .env}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
